apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-saas-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: ai-saas.sadish.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80